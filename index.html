html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--wall);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
img{max-width:100%;display:block}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:3px solid var(--line)}
.top-in{max-width:1100px;margin:0 auto;padding:12px 18px 12px;display:grid;grid-template-columns:1fr auto auto;grid-template-areas:"brand lang scan" "tabs tabs count";gap:10px 16px;align-items:center}
.brand{grid-area:brand}.lang{grid-area:lang}.scan{grid-area:scan}.tabs{grid-area:tabs}.count{grid-area:count}
.brand{display:flex;align-items:baseline;gap:12px;min-width:0}
.brand h1{font-family:var(--display);font-weight:600;font-size:32px;line-height:1;margin:0;color:var(--ink);display:flex;align-items:center;gap:8px}
.brand .logo{width:34px;height:34px;flex:none;color:var(--ink)}
.brand .date{font-family:var(--display);font-weight:400;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scan{display:flex;align-items:center;gap:8px;background:var(--sunk);border-radius:999px;padding:6px 8px 6px 14px;min-width:0;border:2px solid transparent;transition:border-color .2s,background .2s}
.scan svg{flex:none;color:var(--muted)}
.scan input{border:0;background:transparent;width:150px;min-width:0;padding:6px 0;outline:none;font-family:var(--display)}
.scan input::placeholder{color:var(--muted)}
.scan .dot{width:12px;height:12px;border-radius:50%;background:var(--away);margin-right:4px;flex:none;transition:background .2s}
.scan.live{border-color:var(--present);background:var(--present-soft)}
.scan.live .dot{background:var(--present);box-shadow:0 0 0 4px color-mix(in srgb,var(--present) 30%,transparent)}
.tabs{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tab{border:0;background:var(--sunk);padding:8px 16px;border-radius:999px;font-family:var(--display);font-weight:500;font-size:17px;color:var(--muted);cursor:pointer;min-height:40px}
.tab[aria-selected="true"]{background:var(--ink);color:var(--surface)}
.count{justify-self:end;white-space:nowrap;font-family:var(--display);font-weight:500;font-size:15px;background:var(--present-soft);color:var(--present-dark);border-radius:999px;padding:6px 14px}
.count:empty{display:none}
.brand .ds{display:none}
.count .cs{display:none}
.count b{font-weight:700;font-size:18px}
@media (prefers-color-scheme: dark){.count{color:var(--present)}}

main{max-width:1100px;margin:0 auto;padding:18px 18px 60px}
.notice{background:var(--sun-soft);border-radius:18px;padding:12px 16px;margin-bottom:18px;display:none;gap:10px;align-items:center;flex-wrap:wrap}
.notice.show{display:flex}

/* the meadow: every child is a ladybug sitting in the grass */
.rack{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));grid-auto-rows:var(--row);column-gap:10px;row-gap:0;
  background-image:var(--grass);background-size:120px var(--row);background-repeat:repeat;background-position:0 0}
.hook{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;padding-top:38px;-webkit-tap-highlight-color:transparent}
.hook:focus-visible .ring{outline:3px solid var(--focus);outline-offset:3px}
.tagbox{display:flex;flex-direction:column;align-items:center;gap:8px;transform-origin:50% 90%;position:relative}
.ringwrap{position:relative}
.ring{width:140px;height:140px;border-radius:50%;padding:18px;display:grid;place-items:center;transition:background-color .3s;
  background-color:var(--bug-off);
  background-image:
    radial-gradient(circle at 90.4% 64.7%, var(--dot) 0 7px, transparent 7.5px),
    radial-gradient(circle at 74.7% 85.2%, var(--dot) 0 7px, transparent 7.5px),
    radial-gradient(circle at 25.3% 85.2%, var(--dot) 0 7px, transparent 7.5px),
    radial-gradient(circle at 9.6% 64.7%, var(--dot) 0 7px, transparent 7.5px),
    radial-gradient(circle at 9.6% 35.3%, var(--dot) 0 7px, transparent 7.5px),
    radial-gradient(circle at 90.4% 35.3%, var(--dot) 0 7px, transparent 7.5px),
    linear-gradient(90deg, transparent calc(50% - 1.5px), var(--dot) calc(50% - 1.5px) calc(50% + 1.5px), transparent calc(50% + 1.5px));
  box-shadow:0 6px 0 rgba(30,60,30,.13)}
.hook .ring{--dot:var(--dot-off)}
.hook[data-state="in"] .ring{background-color:var(--bug);--dot:var(--bug-dot)}
.hook[data-state="sleep"] .ring{background-color:var(--bug-sleep);--dot:var(--bug-dot)}
.lb-head{position:absolute;top:-33px;left:50%;width:64px;height:44px;margin-left:-32px;z-index:2;overflow:visible}
.lb-head .h{fill:var(--bug-dot)}
.lb-head .ant{stroke:var(--bug-dot);stroke-width:3;fill:none;stroke-linecap:round}
.lb-head .knob{fill:var(--bug-dot)}
.lb-head .eye{fill:#fff}.lb-head .pup{fill:#1E1E24}
.lb-head .lid{stroke:#fff;stroke-width:2.6;fill:none;stroke-linecap:round}
.hook[data-state="absent"] .lb-head,.hook[data-state="out"] .lb-head{opacity:.45}
.av{width:100%;height:100%;border-radius:50%;overflow:hidden;display:grid;place-items:center;font-family:var(--display);font-size:36px;font-weight:600;color:#fff;border:4px solid var(--surface)}
.av img{width:100%;height:100%;object-fit:cover}
.hook[data-state="absent"] .av,.hook[data-state="out"] .av{filter:saturate(.45) brightness(1.02)}
.hook .nm{font-family:var(--display);font-weight:600;font-size:19px;line-height:1.1;background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 14px;box-shadow:0 3px 0 var(--line);max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hook .st{font-family:var(--display);font-size:14px;color:var(--muted);min-height:20px;line-height:1.2;padding:0 4px}
.hook[data-state="in"] .st{color:var(--present-dark)}
.hook[data-state="sleep"] .st{color:var(--sleep-dark)}
@media (prefers-color-scheme: dark){.hook[data-state="in"] .st{color:var(--present)}.hook[data-state="sleep"] .st{color:var(--sleep)}}
.zz{position:absolute;top:-30px;right:-6px;font-family:var(--display);font-weight:700;color:var(--sleep-dark);font-size:20px;line-height:1;z-index:3}
@media (prefers-color-scheme: dark){.zz{color:var(--sleep)}}
.hook .allergy-dot{position:absolute;top:8px;right:-10px;width:30px;height:30px;border-radius:50%;background:#fff;color:var(--alert);border:3px solid var(--alert);font-family:var(--display);font-weight:700;font-size:16px;display:grid;place-items:center;z-index:3}
.swing{animation:hop .9s cubic-bezier(.3,.7,.4,1)}
@keyframes hop{0%{transform:translateY(0) rotate(0)}25%{transform:translateY(-16px) rotate(-8deg)}45%{transform:translateY(0) rotate(6deg)}62%{transform:translateY(-6px) rotate(-3deg)}80%{transform:translateY(0) rotate(1deg)}100%{transform:none}}
.empty{text-align:center;padding:60px 20px 20px;color:var(--muted)}
.rack .empty{background:var(--surface);border-radius:24px;margin-top:50px;padding:28px 20px;align-self:start;box-shadow:0 4px 0 var(--line)}
.empty h2{font-family:var(--display);font-weight:600;color:var(--ink);font-size:26px;margin:0 0 6px}
.empty p{margin:0 0 16px}

/* chunky toy buttons */
.btn{--shade:var(--line);border:0;border-radius:16px;padding:12px 18px;font-family:var(--display);font-weight:500;font-size:17px;cursor:pointer;background:var(--sunk);min-height:50px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink);box-shadow:0 4px 0 var(--shade);transition:transform .08s,box-shadow .08s;-webkit-tap-highlight-color:transparent;margin-bottom:4px}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--shade)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--ink);color:var(--surface);--shade:var(--ink-dark)}
.btn.go{background:var(--present);color:#fff;--shade:var(--present-dark)}
.btn.sleep{background:var(--sleep-soft);color:var(--sleep-dark);--shade:color-mix(in srgb,var(--sleep) 35%,var(--sleep-soft))}
.btn.sleep.on{background:var(--sleep);color:#fff;--shade:var(--sleep-dark)}
.btn.dia{background:var(--sun-soft);color:var(--sun-dark);--shade:var(--sun-shade)}
@media (prefers-color-scheme: dark){.btn.sleep{color:var(--sleep)}}
.btn.danger{background:none;color:var(--alert);padding-left:0;padding-right:0;box-shadow:none}
.btn.ghost{background:var(--surface);border:2px solid var(--line)}
.btn.small{min-height:40px;padding:7px 14px;border-radius:12px;font-size:15px;--shade:var(--line)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px;align-items:center}
.list{background:var(--surface);border-radius:22px;overflow:hidden;box-shadow:0 4px 0 var(--line)}
.item{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center;padding:12px 16px;border-bottom:2px solid var(--sunk)}
.item:last-child{border-bottom:0}
.item b{font-family:var(--display);font-weight:600;font-size:18px}
.item:focus-visible{outline:3px solid var(--focus);outline-offset:-3px}
.item .av{width:56px;height:56px;font-size:20px;border-width:0}
.item.rep{grid-template-columns:1fr auto}
.sub{color:var(--muted);font-size:15px}
.chip{display:inline-block;border-radius:999px;padding:3px 11px;font-family:var(--display);font-size:13px;font-weight:600;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.alert{background:var(--alert-soft);color:var(--alert)}
.chip.ok{background:var(--present-soft);color:var(--present-dark)}
@media (prefers-color-scheme: dark){.chip.ok{color:var(--present)}}

.panel{background:var(--surface);border-radius:22px;padding:20px;margin-bottom:18px;box-shadow:0 4px 0 var(--line)}
.panel h2{font-family:var(--display);font-weight:600;font-size:23px;margin:0 0 6px}
.panel p{margin:0 0 14px;max-width:62ch}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(26,31,61,.5);z-index:20;display:none;align-items:flex-end;justify-content:center}
.scrim.open{display:flex}
.sheet{background:var(--surface);width:100%;max-width:720px;max-height:92vh;max-height:92dvh;overflow:auto;-webkit-overflow-scrolling:touch;border-radius:30px 30px 0 0;padding:14px 20px calc(28px + env(safe-area-inset-bottom,0px));animation:up .25s cubic-bezier(.2,.9,.3,1.2)}
.sheet::before{content:"";display:block;width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
@media (min-width:760px){.scrim{align-items:center}.sheet{border-radius:30px;max-height:88vh}.sheet::before{display:none}.sheet{padding-top:22px}}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
.sh-head{display:flex;gap:16px;align-items:center;margin-bottom:16px}
.sh-head .ring{width:90px;height:90px;padding:5px;flex:none;box-shadow:none}
.sh-head .av{font-size:28px}
.sh-head h2{font-family:var(--display);font-weight:600;font-size:28px;margin:0;line-height:1.1}
.close{margin-left:auto;align-self:flex-start;border:0;background:var(--sunk);width:44px;height:44px;border-radius:50%;cursor:pointer;font-size:24px;line-height:1;flex:none;color:var(--muted)}
.banner{background:var(--alert-soft);color:var(--alert);border-radius:18px;padding:10px 14px 10px 12px;font-family:var(--display);font-weight:600;margin-bottom:14px;display:flex;gap:10px;align-items:center}
.banner::before{content:"!";flex:none;width:28px;height:28px;border-radius:50%;background:var(--alert);color:#fff;display:grid;place-items:center;font-weight:700}
.banner span{font-family:var(--body);font-weight:400;color:var(--ink)}
.block{border-top:2px dashed var(--sunk);padding:16px 0}
.block h3{font-family:var(--display);font-weight:600;font-size:20px;margin:0 0 10px}
.big{width:100%;min-height:62px;font-size:21px;border-radius:20px}
.timefield{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:15px}
.timefield input{border:2px solid var(--line);background:var(--wall);border-radius:12px;padding:6px 8px;min-height:40px}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:58px 1fr auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line)}
.tl li:last-child{border-bottom:0}
.tl time{font-family:var(--display);font-weight:600;font-variant-numeric:tabular-nums}
.x{border:0;background:none;color:var(--muted);font-size:22px;width:40px;height:40px;border-radius:50%;cursor:pointer}
.tag{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px;vertical-align:middle}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
.photos figure{margin:0;position:relative;aspect-ratio:1;border-radius:18px;overflow:hidden;background:var(--sunk)}
.photos img{width:100%;height:100%;object-fit:cover}
.photos figcaption{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;border-radius:8px;padding:1px 7px}
.photos .px{position:absolute;top:5px;right:5px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:18px;cursor:pointer}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.note-in{display:flex;gap:8px}
.note-in input{flex:1;min-width:0;border:2px solid var(--line);background:var(--wall);border-radius:14px;padding:10px 12px}
dl.info{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:10px 0 0}
dl.info dt{color:var(--muted)}
dl.info dd{margin:0;overflow-wrap:anywhere}
dl.info a{color:var(--focus)}
details summary{cursor:pointer;font-family:var(--display);font-size:20px;font-weight:600;padding:4px 0}
.hist{width:100%;border-collapse:collapse;font-size:15px}
.hist td,.hist th{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.hist th{color:var(--muted);font-weight:400}
pre.report{white-space:pre-wrap;font-family:var(--body);font-size:16px;background:var(--wall);border-radius:16px;padding:14px;margin:10px 0;overflow-wrap:anywhere}

form .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){form .grid{grid-template-columns:1fr}}
fieldset{border:0;padding:0;margin:0 0 20px}
legend{font-family:var(--display);font-weight:600;font-size:20px;margin-bottom:8px;padding:0}
label.f,div.f{display:flex;flex-direction:column;gap:4px;font-size:15px;color:var(--muted)}
label.f.wide,div.f.wide{grid-column:1/-1}
label.f input,label.f textarea{border:2px solid var(--line);background:var(--wall);border-radius:14px;padding:10px 12px;color:var(--ink);font-size:17px;min-height:48px}
textarea{resize:vertical}
.mailbox textarea{width:100%;min-height:280px;border:2px solid var(--line);background:var(--wall);border-radius:16px;padding:12px;font-size:16px}
.av.sym{background:hsl(var(--h) 75% 88%) !important;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;font-size:58px;line-height:1}
@media (prefers-color-scheme: dark){.av.sym{background:hsl(var(--h) 30% 32%) !important}}
.item .av.sym{font-size:30px}
.sh-head .av.sym{font-size:48px}
.symgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px;grid-column:1/-1;margin-top:4px}
.symgrid button{height:54px;border-radius:16px;border:3px solid transparent;background:var(--sunk);font-size:30px;cursor:pointer;line-height:1;padding:0}
.symgrid button.used{opacity:.35}
.symgrid button[aria-pressed="true"]{border-color:var(--present);background:var(--present-soft);opacity:1;transform:scale(1.06)}
.symgrid .none{font-family:var(--display);font-size:14px;font-weight:600;color:var(--muted)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(calc(100% + 40px + env(safe-area-inset-bottom,0px)));opacity:0;visibility:hidden;pointer-events:none;background:var(--ink);color:var(--surface);padding:12px 20px;border-radius:999px;z-index:40;max-width:min(92vw,520px);transition:transform .3s cubic-bezier(.2,.9,.3,1.3),opacity .2s,visibility 0s linear .3s;font-family:var(--display);font-weight:500;text-align:center}
.toast.show{transition:transform .3s cubic-bezier(.2,.9,.3,1.3),opacity .2s,visibility 0s}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;visibility:visible}
.hidden{display:none !important}
@media (max-width:560px){
  :root{--row:264px}
  .top-in{grid-template-columns:1fr auto;grid-template-areas:"brand count" "scan lang" "tabs tabs";padding:10px 14px}
  .scan input{width:100%}
  .tab{flex:1;padding:7px 10px;font-size:16px}
  .count{padding:4px 11px;font-size:14px}
  .item{grid-template-columns:56px 1fr;row-gap:6px}
  .item > .row{grid-column:2;justify-content:flex-start !important}
  .item.rep{grid-template-columns:1fr auto}
  .item.rep > .chip{grid-column:auto}
  .rack{grid-template-columns:repeat(auto-fill,minmax(112px,1fr));column-gap:4px}
  .ring{width:118px;height:118px;padding:15px}
  .hook .nm{font-size:17px;max-width:110px}
  .brand h1{font-size:25px;gap:6px}
  .brand .logo{width:26px;height:26px}
  .brand{gap:8px}
  .count .cl{display:none}
  .count .cs{display:inline}
  .brand .dl{display:none}
  .brand .ds{display:inline}
}
@media (prefers-reduced-motion:reduce){.swing,.sheet{animation:none}.ring,.toast{transition:none}.btn{transition:none}}

.lang{display:flex;gap:2px;background:var(--sunk);border-radius:999px;padding:4px;align-self:center}
.lang button{border:0;background:none;font-family:var(--display);font-weight:600;font-size:14px;color:var(--muted);padding:6px 10px;border-radius:999px;cursor:pointer;min-width:42px;min-height:36px}
.lang button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 0 var(--line)}

.btn.food{background:var(--present-soft);color:var(--present-dark);--shade:color-mix(in srgb,var(--present) 35%,var(--present-soft))}
.btn.food.on{background:var(--present);color:#fff;--shade:var(--present-dark)}
@media (prefers-color-scheme: dark){.btn.food{color:var(--present)}.btn.food.on{color:#fff}}
.foodbox{margin-top:12px;background:var(--wall);border-radius:20px;padding:14px 16px}
.amount{display:flex;align-items:center;justify-content:center;gap:16px}
.amount output{font-family:var(--display);font-weight:600;font-size:32px;min-width:130px;text-align:center;color:var(--ink)}
.step{width:54px;height:54px;border-radius:50%;border:0;background:var(--surface);font-family:var(--display);font-size:28px;font-weight:600;color:var(--ink);box-shadow:0 3px 0 var(--line);cursor:pointer}
.step:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.step:disabled{opacity:.4}
input.food-range{width:100%;margin:14px 0 4px;accent-color:var(--present);height:34px}
.range-scale{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;font-family:var(--display)}
label.f select{border:2px solid var(--line);background:var(--wall);border-radius:14px;padding:10px 12px;color:var(--ink);font-size:17px;min-height:48px;-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 14px) 21px;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid2 .mt{color:var(--ink);font-family:var(--display);font-weight:600;font-size:17px;min-height:48px;display:flex;align-items:center}
@media (max-width:560px){.lang button{min-width:36px;padding:6px 8px}}
@media (max-width:900px){.brand .dl{display:none}.brand .ds{display:inline}}
.brand .dm{display:none}
@media (max-width:560px){.brand .ds{display:none !important}.brand .dm{display:inline}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand"><h1><svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><path d="M14 9 Q11 3 6 3" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M26 9 Q29 3 34 3" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round"/><circle cx="20" cy="12" r="7" fill="#1E1E24"/><circle cx="20" cy="24" r="14" fill="#E5383B"/><path d="M20 10 V38" stroke="#1E1E24" stroke-width="2"/><circle cx="13" cy="20" r="2.8" fill="#1E1E24"/><circle cx="27" cy="20" r="2.8" fill="#1E1E24"/><circle cx="12" cy="29" r="2.4" fill="#1E1E24"/><circle cx="28" cy="29" r="2.4" fill="#1E1E24"/><circle cx="20" cy="31" r="0" fill="#1E1E24"/></svg>Pimpapunt</h1><span class="date" id="today-label"></span></div>
    <div class="lang" role="group" data-ilabel="lang_label">
      <button type="button" data-lang="nl">NL</button>
      <button type="button" data-lang="fr">FR</button>
      <button type="button" data-lang="en">EN</button>
    </div>
    <label class="scan" id="scanbox">
      <span class="dot" aria-hidden="true"></span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="3"/><path d="M7 10h4M7 14h7"/></svg>
      <input id="scan" type="text" inputmode="none" autocomplete="off" autocapitalize="off" spellcheck="false" data-iph="scan_ph" data-ilabel="scan_ph">
    </label>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" aria-selected="true" data-tab="today" data-i="tab_today"></button>
      <button class="tab" role="tab" aria-selected="false" data-tab="kids" data-i="tab_kids"></button>
      <button class="tab" role="tab" aria-selected="false" data-tab="admin" data-i="tab_admin"></button>
    </nav>
    <span class="count" id="count"></span>
  </div>
</header>

<main>
  <div class="notice" id="notice"></div>
  <section id="view-today"><div class="rack" id="rack"></div></section>
  <section id="view-kids" class="hidden">
    <div class="toolbar"><button class="btn primary" data-act="new-kid" data-i="add_kid"></button></div>
    <div class="list" id="kidlist"></div>
  </section>
  <section id="view-admin" class="hidden">
    <div class="panel">
      <h2 data-i="a_backup_h"></h2>
      <p data-i="a_backup_p"></p>
      <p class="sub" id="last-backup"></p>
      <div class="row">
        <button class="btn primary" data-act="backup" data-photos="0" data-i="a_backup_nophotos"></button>
        <button class="btn ghost" data-act="backup" data-photos="30" data-i="a_backup_photos"></button>
        <label class="btn ghost filebtn"><span data-i="a_restore"></span><input type="file" id="restore-in" accept="application/json,.json"></label>
      </div>
      <div id="backup-ready" class="row" style="margin-top:12px"></div>
    </div>
    <div class="panel">
      <h2 data-i="a_csv_h"></h2>
      <p data-i="a_csv_p"></p>
      <div class="row">
        <label class="btn ghost filebtn"><span data-i="a_csv_import"></span><input type="file" id="csv-in" accept=".csv,text/csv,text/plain"></label>
        <button class="btn ghost" data-act="csv-export" data-i="a_csv_export"></button>
        <button class="btn ghost" data-act="csv-template" data-i="a_csv_template"></button>
      </div>
    </div>
    <div class="panel">
      <h2 data-i="a_report_h"></h2>
      <label class="f"><span data-i="a_sign"></span><input id="set-sign" data-iph="a_sign_ph"></label>

const pad = n => String(n).padStart(2,"0");
const dayKey = (d=new Date()) => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const hhmm = iso => { if(!iso) return "–"; const d=new Date(iso); return pad(d.getHours())+":"+pad(d.getMinutes()); };
const parseKey = key => { const [y,m,d]=key.split("-").map(Number); return new Date(y,m-1,d); };
const longDate = (key, lang=L) => { const dt=parseKey(key), c=CAL[lang]; return c.days[dt.getDay()]+" "+dt.getDate()+" "+c.months[dt.getMonth()]; };
const shortDay = (key, lang=L) => { const dt=parseKey(key), c=CAL[lang]; return c.days[dt.getDay()].slice(0, lang==="nl"?2:3)+" "+dt.getDate()+" "+c.months[dt.getMonth()].slice(0,3); };
const shortDate = key => { const dt=parseKey(key); return dt.getDate()+"/"+(dt.getMonth()+1); };
const dur = (a,b,lang=L) => { const m=Math.round((new Date(b)-new Date(a))/60000); if(m<60) return m+" min"; return Math.floor(m/60)+" "+CAL[lang].h+" "+pad(m%60)+" min"; };
const uid = () => (crypto.randomUUID ? crypto.randomUUID().replace(/-/g,"").slice(0,16) : Date.now().toString(36)+Math.random().toString(36).slice(2,8));
const HUES = [205,160,28,340,265,95,190,12,300,48];
const hue = s => { let h=0; for(const c of String(s)) h=(h*31+c.charCodeAt(0))>>>0; return HUES[h%HUES.length]; };
const fullName = c => [c.voornaam, c.naam].filter(Boolean).join(" ");
const safeName = s => String(s||"kind").replace(/[^\w-]+/g,"_");
const normBadge = s => String(s||"").trim().toUpperCase();
const photoCount = n => t(n===1?"photo_1":"photo_n",{n});

function age(bd){
  if(!bd) return ""; const b=new Date(bd), n=new Date(); if(isNaN(b)) return "";
  let months=(n.getFullYear()-b.getFullYear())*12+(n.getMonth()-b.getMonth()); if(n.getDate()<b.getDate()) months--;
  if(months<0) return "";
  if(months<24) return t(months===1?"age_m1":"age_mn",{n:months});
  const y=Math.floor(months/12), r=months%12;
  const ys=t(y===1?"age_y":(T[L].age_yn?"age_yn":"age_y"),{n:y});
  return ys+(r? ", "+t(r===1?"age_m1":"age_mn",{n:r}):"");
}
/* mother tongue */
function langName(code){ return code? t("lang_"+code) : ""; }
function motherTongue(c){ if(!c.moedertaal) return "–"; if(c.moedertaal==="other") return c.moedertaal_andere || t("lang_other"); return langName(c.moedertaal); }
function mailLangOf(c){ if(LANGS.includes(c.moedertaal)) return c.moedertaal; if(LANGS.includes(c.mailtaal)) return c.mailtaal; return "nl"; }
function parseLangValue(v){
  const s=String(v||"").trim().toLowerCase(); if(!s) return {};
  if(["nl","nederlands","néerlandais","dutch","vlaams"].includes(s)) return {moedertaal:"nl"};
  if(["fr","frans","français","francais","french"].includes(s)) return {moedertaal:"fr"};
  if(["en","engels","anglais","english"].includes(s)) return {moedertaal:"en"};
  return {moedertaal:"other", moedertaal_andere:String(v).trim()};
}

/* ================= IndexedDB ================= */
const DB = {
  db:null,
  open(){
    return new Promise((res,rej)=>{
      const r=indexedDB.open("kapstok",1);
      r.onupgradeneeded=()=>{ const d=r.result;
        d.createObjectStore("children",{keyPath:"id"});
        d.createObjectStore("days",{keyPath:"date"});
        const rs=d.createObjectStore("reports",{keyPath:"key"}); rs.createIndex("childId","childId");
        d.createObjectStore("photos",{keyPath:"id"}); };
      r.onsuccess=()=>{ DB.db=r.result; res(); };
      r.onerror=()=>rej(r.error);
    });
  },
  run(store, mode, fn){
    return new Promise((res,rej)=>{
      const tx=DB.db.transaction(store,mode); const req=fn(tx.objectStore(store)); let out;
      if(req) req.onsuccess=()=>{ out=req.result; };
      tx.oncomplete=()=>res(out); tx.onerror=()=>rej(tx.error); tx.onabort=()=>rej(tx.error);
    });
  },
  get:(st,k)=>DB.run(st,"readonly",s=>s.get(k)),
  all:(st)=>DB.run(st,"readonly",s=>s.getAll()),
  put:(st,v)=>DB.run(st,"readwrite",s=>s.put(v)),
  del:(st,k)=>DB.run(st,"readwrite",s=>s.delete(k)),
  byIndex:(st,idx,k)=>DB.run(st,"readonly",s=>s.index(idx).getAll(k)),
};
function failWrite(err){
  const n=err && err.name;
  if(n==="QuotaExceededError") toast(t("err_full"));
  else toast(t("err_save",{e: n? " ("+n+")":""}));
}

/* ================= photos ================= */
const urlCache=new Map();
async function photoURL(id){
  if(urlCache.has(id)) return urlCache.get(id);
  const p=await DB.get("photos",id).catch(()=>null); if(!p||!p.blob) return null;
  const u=URL.createObjectURL(p.blob); urlCache.set(id,u); return u;
}
function hydratePhotos(root=document){
  root.querySelectorAll("img[data-photo]:not([src])").forEach(img=>{
    photoURL(img.dataset.photo).then(u=>{ if(u) img.src=u; else { const f=img.closest("figure"); (f||img).remove(); } });
  });
}
function compress(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file); const img=new Image();
    img.onload=()=>{ const max=1400; let w=img.naturalWidth, h=img.naturalHeight; const r=Math.min(1,max/Math.max(w,h)); w=Math.round(w*r); h=Math.round(h*r);
      const cv=document.createElement("canvas"); cv.width=w; cv.height=h; cv.getContext("2d").drawImage(img,0,0,w,h);
      cv.toBlob(b=>{ URL.revokeObjectURL(url); b? res(b) : rej(new Error("compress")); }, "image/jpeg", .8); };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error("load")); };
    img.src=url;
  });
}
async function storePhoto(file){ const blob=await compress(file); const id=uid(); await DB.put("photos",{id, blob, createdAt:new Date().toISOString()}); return id; }

/* ================= files out ================= */
async function saveFile(name, blob){
  try{
    const file=new File([blob], name, {type:blob.type||"application/octet-stream"});
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file]}); return; }
  }catch(err){ if(err && err.name==="AbortError") return; }
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },5000);
}
const blobToDataURL = b => new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(r.error); r.readAsDataURL(b); });

const S = { drafts:{}, children:new Map(), day:null, date:dayKey(), openChild:null, sheetMode:null, ready:false };
const kidsSorted = () => [...S.children.values()].sort((a,b)=>(a.voornaam||"").localeCompare(b.voornaam||"","nl"));
const emptyEntry = () => ({ sessions:[], sleeps:[], diapers:[], meals:[], notes:[], photos:[], mailedAt:null });
function entry(id){ const e=S.day && S.day.kids[id]; return Object.assign(emptyEntry(), e ? JSON.parse(JSON.stringify(e)) : {}); }
function status(id){
  const e=entry(id); const last=e.sessions[e.sessions.length-1];
  if(!last) return {state:"absent", label:t("st_absent")};
  if(last.out) return {state:"out", label:t("st_out",{t:hhmm(last.out)})};
  const sl=e.sleeps[e.sleeps.length-1];
  if(sl && !sl.end) return {state:"sleep", label:t("st_sleep",{t:hhmm(sl.start)})};
  return {state:"in", label:t("st_in",{t:hhmm(last.in)})};
}
async function loadAll(){
  const kids=await DB.all("children"); S.children=new Map(kids.map(c=>[c.id,c]));
  S.day=(await DB.get("days",S.date)) || {date:S.date, kids:{}};
  S.ready=true; renderAll(); checkBackupAge();
}
function saveEntry(id, mutate){
  const e=entry(id); mutate(e); S.day.kids[id]=e; S.day.date=S.date;
  DB.put("days", S.day).catch(failWrite);
  renderAll();
}
function at(){ const v=$("#act-time") && $("#act-time").value; if(!v) return new Date().toISOString(); const [h,m]=v.split(":").map(Number); const d=new Date(); d.setHours(h,m,0,0); return d.toISOString(); }
function resetTime(){ const el=$("#act-time"); if(el) el.value=""; }

/* ================= actions ================= */
function checkIn(id,tm){ saveEntry(id, e=>{ e.sessions.push({in:tm||new Date().toISOString(), out:null}); }); }
function checkOut(id,tm){
  const when=tm||new Date().toISOString();
  saveEntry(id, e=>{ const last=e.sessions[e.sessions.length-1]; if(last && !last.out) last.out=when; const sl=e.sleeps[e.sleeps.length-1]; if(sl && !sl.end) sl.end=when; });
}
function togglePresence(id){
  const st=status(id).state; const c=S.children.get(id); const now=new Date().toISOString();
  if(st==="absent"||st==="out"){ checkIn(id,now); toast(t("is_in_at",{n:c.voornaam,t:hhmm(now)})); return "in"; }
  checkOut(id,now); toast(t("leaves_at",{n:c.voornaam,t:hhmm(now)})); return "out";
}

function handleBadge(raw){
  const code=normBadge(raw); if(code.length<3 || !S.ready) return;
  if(S.sheetMode==="form"){ const f=$("#f-badge"); if(f){ f.value=code; toast(t("badge_filled")); } return; }
  const kid=kidsSorted().find(c=>normBadge(c.badge)===code);
  if(!kid){ openLinkBadge(code); return; }
  const res=togglePresence(kid.id);
  if(res==="out") openMail(kid.id); else if(S.sheetMode==="child" && S.openChild===kid.id) renderSheet();
}
let buf="", lastKey=0;
document.addEventListener("keydown", ev=>{
  const tgt=ev.target, tag=(tgt && tgt.tagName)||"";
  if(tgt && (tgt.id==="scan" || tag==="INPUT" || tag==="TEXTAREA" || tag==="SELECT")) return;
  const now=Date.now(); if(now-lastKey>120) buf=""; lastKey=now;
  if(ev.key==="Enter"){ if(buf.length>=4){ ev.preventDefault(); handleBadge(buf); } buf=""; return; }
  if(ev.key && ev.key.length===1) buf+=ev.key;
});

function mailSubject(c, date, lang){ return tm(lang,"subject",{n:c.voornaam, d:longDate(date,lang)}); }
function mailBody(c, e, date, lang){
  const M=MAIL[lang]; const Lx=[]; const s0=e.sessions[0], sl=e.sessions[e.sessions.length-1];
  const byTime=(a,b)=>new Date(a.t)-new Date(b.t);
  Lx.push(M.hello,"",tm(lang,"intro",{n:c.voornaam, d:longDate(date,lang)}),"");
  const col = lang==="fr"? " : " : ": ";
  Lx.push(M.arrived+col+(s0?hhmm(s0.in):"–"));
  Lx.push(M.left+col+(sl&&sl.out?hhmm(sl.out):M.still));
  if(e.meals.length){ Lx.push("",M.food); e.meals.slice().sort(byTime).forEach(m=>{
    const txt = m.type==="bottle"? tm(lang,"bottle",{n:m.ml}) : m.type==="potato"? tm(lang,"potato",{n:m.g}) : M.fruit+(m.note? " – "+m.note : "");
    Lx.push(`- ${hhmm(m.t)} ${txt}`); }); }
  Lx.push("",M.sleep);
  if(e.sleeps.length) e.sleeps.forEach(x=>Lx.push("- "+tm(lang,"sleep_line",{a:hhmm(x.start), b:x.end?hhmm(x.end):"…", d:x.end?dur(x.start,x.end,lang):"…"})));
  else Lx.push("- "+M.no_sleep);
  Lx.push("",M.dia);
  if(e.diapers.length) e.diapers.slice().sort(byTime).forEach(d=>Lx.push(`- ${hhmm(d.t)} ${M.kinds[DIA_KEY[d.kind]||"wet"]}`)); else Lx.push("- "+M.no_dia);
  if(e.notes.length){ Lx.push("",M.notes); e.notes.slice().sort(byTime).forEach(n=>Lx.push(`- ${hhmm(n.t)} ${n.text}`)); }
  if(e.photos.length) Lx.push("", e.photos.length===1? M.photos_1 : tm(lang,"photos_n",{n:e.photos.length}));
  Lx.push("",M.bye, SET.sign||M.sign);
  return Lx.join("\n");
}
let shareFiles=[];
async function prepareShareFiles(e, c, date){

  for(const [i,p] of e.photos.entries()){
    const rec=await DB.get("photos",p.id).catch(()=>null);
    if(rec && rec.blob) shareFiles.push(new File([rec.blob], `${safeName(c.voornaam)}-${date}-${i+1}.jpg`, {type:"image/jpeg"}));
  }
  const btn=$("#m-share"); if(!btn) return;
  let ok=false; try{ ok = shareFiles.length>0 && !!navigator.canShare && navigator.canShare({files:shareFiles}); }catch(_){}
  btn.classList.toggle("hidden", !ok);
  btn.textContent=t("share_with",{p:photoCount(shareFiles.length)});
  const hint=$("#m-hint"); if(hint && !ok && e.photos.length) hint.textContent=t("share_no");
}
async function openMail(id){

  $("#sheet").innerHTML=`

    <div class="mailbox">
      <div class="sub" style="margin-bottom:8px;overflow-wrap:anywhere">${esc(t("to"))}: ${to.length? esc(to.join(", ")) : `<b style="color:var(--alert)">${esc(t("no_email"))}</b>`}</div>

      </div>

      <label class="f wide" style="margin-top:10px">${esc(t("message"))}<textarea id="m-body">${esc(body)}</textarea></label>
    </div>
    <p id="m-edited" class="row${edited?"":" hidden"} sub">${esc(t("edited_note"))} <button class="btn small ghost" id="m-refresh" type="button">${esc(t("rebuild"))}</button></p>
    ${e.photos.length?`<p id="m-hint" class="sub">${esc(t("share_hint"))}</p>`:""}
    <div class="row" style="margin-top:14px">
      <button class="btn go hidden" id="m-share" type="button">${esc(t("share_btn"))}</button>
      <a class="btn ${e.photos.length?"":"go"}" id="m-open">${esc(t(e.photos.length?"open_mail_nophotos":"open_mail"))}</a>
      <button class="btn" data-act="copy">${esc(t("copy"))}</button>
      <button class="btn ghost" data-act="back">${esc(t("back_to",{n:c.voornaam}))}</button>
    </div>`;
  const subj=$("#m-subj"), bd=$("#m-body"), ls=$("#m-lang");
  const record=()=>({to, subject:subj.value, body:bd.value, lang, photos:e.photos.map(p=>p.id), status, edited, updatedAt:new Date().toISOString()});
  const upd=()=>{ $("#m-open").href=`mailto:${to.map(encodeURIComponent).join(",")}?subject=${encodeURIComponent(subj.value)}&body=${encodeURIComponent(bd.value)}`; };
  upd(); saveReport(id,date,record());
  let tmr;
  const rebuild=()=>{ clearTimeout(tmr); subj.value=mailSubject(c,date,lang); bd.value=mailBody(c,entry(id),date,lang); edited=false; $("#m-edited").classList.add("hidden"); upd(); saveReport(id,date,record()); };
  const onEdit=()=>{ upd(); if(!edited){ edited=true; $("#m-edited").classList.remove("hidden"); } clearTimeout(tmr); tmr=setTimeout(()=>saveReport(id,date,record()),800); };
  subj.addEventListener("input",onEdit); bd.addEventListener("input",onEdit);
  ls.addEventListener("change", ()=>{ if(edited && !confirm(t("relang_confirm"))){ ls.value=lang; return; } lang=ls.value; rebuild(); });
  $("#m-refresh").addEventListener("click", rebuild);
  const markSent=st=>{ clearTimeout(tmr); status=st; saveReport(id,date,record()); saveEntry(id, x=>{ x.mailedAt=new Date().toISOString(); }); };
  $("#m-open").addEventListener("click", ()=>markSent("opened"));
  $("#m-share").addEventListener("click", async ()=>{
    try{ await navigator.share({title:subj.value, text:subj.value+"\n\n"+bd.value, files:shareFiles}); markSent("shared"); }

async function saveKid(id, form){
  const fd=new FormData(form); const data={};
  for(const [k,v] of fd.entries()){ if(typeof v==="string") data[k]=v.trim(); }
  if(!data.voornaam||!data.naam){ toast(t("need_name")); return; }
  data.badge=normBadge(data.badge);
  if(data.badge){ const dup=kidsSorted().find(c=>c.id!==id && normBadge(c.badge)===data.badge); if(dup){ toast(t("badge_taken",{n:fullName(dup)})); return; } }
  if(data.moedertaal!=="other"){ delete data.moedertaal_andere; delete data.mailtaal; }
  const newId=id||uid(); const old=id? S.children.get(id):{};
  data.id=newId; data.photo=old.photo||null;
  if(data.delphoto){ if(data.photo) DB.del("photos",data.photo).catch(()=>{}); data.photo=null; } delete data.delphoto;
  try{
    const pf=$("#f-photo"); if(pf && pf.files && pf.files[0]) data.photo=await storePhoto(pf.files[0]);
    data.updatedAt=new Date().toISOString();
    await DB.put("children", data); S.children.set(newId, data);
    toast(t("kid_saved",{n:data.voornaam})); closeSheet(); renderAll();
  }catch(err){ failWrite(err); }
}

/* ================= CSV ================= */
const CSV_COLS=["voornaam","naam","geboortedatum","adres","moedertaal","moedertaal_andere","mailtaal","ouder1_naam","ouder1_email","ouder1_tel","ouder2_naam","ouder2_email","ouder2_tel","nood_naam","nood_relatie","nood_tel","huisarts","huisarts_tel","allergieen","badge","symbool"];
function parseCSV(text){
  text=text.replace(/^\uFEFF/,"");
  const first=text.split(/\r?\n/)[0]||""; const sep=(first.split(";").length>=first.split(",").length)?";":",";
  const rows=[]; let row=[], cur="", q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
    else if(ch==='"') q=true;
    else if(ch===sep){ row.push(cur); cur=""; }
    else if(ch==="\n"||ch==="\r"){ if(ch==="\r"&&text[i+1]==="\n") i++; row.push(cur); rows.push(row); row=[]; cur=""; }
    else cur+=ch;
  }
  if(cur||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.some(c=>c.trim()));
}
const csvCell = v => { v=String(v??""); return /[;"\n]/.test(v)? '"'+v.replace(/"/g,'""')+'"' : v; };
const toCSV = list => "\uFEFF"+[CSV_COLS.join(";"), ...list.map(c=>CSV_COLS.map(k=>csvCell(c[k])).join(";"))].join("\r\n");
$("#csv-in").addEventListener("change", async ev=>{
  const f=ev.target.files[0]; ev.target.value=""; if(!f) return;
  const rows=parseCSV(await f.text()); if(rows.length<2){ toast(t("csv_empty")); return; }
  const head=rows[0].map(h=>h.trim().toLowerCase());
  if(!head.includes("voornaam")||!head.includes("naam")){ toast(t("csv_cols")); return; }
  let added=0, updated=0;
  for(const r of rows.slice(1)){
    const d={}; head.forEach((h,i)=>{ if(CSV_COLS.includes(h)) d[h]=(r[i]||"").trim(); });
    if(!d.voornaam||!d.naam) continue;
    d.badge=normBadge(d.badge);
    if(d.moedertaal!==undefined){
      const raw=d.moedertaal; delete d.moedertaal;
      if(raw==="other"){ d.moedertaal="other"; } else if(raw){ Object.assign(d, parseLangValue(raw)); }
    }
    if(d.mailtaal){ const m=parseLangValue(d.mailtaal).moedertaal; d.mailtaal = LANGS.includes(m)? m : "nl"; }
    for(const k of Object.keys(d)){ if(d[k]==="") delete d[k]; }
    const match=kidsSorted().find(c=>(d.badge && normBadge(c.badge)===d.badge) || (c.voornaam===d.voornaam && c.naam===d.naam && (c.geboortedatum||"")===(d.geboortedatum||"")));
    const data=Object.assign({}, match||{}, d, {id: match? match.id : uid(), updatedAt:new Date().toISOString()});
    try{ await DB.put("children",data); S.children.set(data.id,data); match? updated++ : added++; }
    catch(err){ failWrite(err); break; }
  }
  renderAll(); toast(t("csv_done",{a:added,u:updated}));
});

/* ================= backup ================= */
function checkBackupAge(){
  const last=localStorage.getItem("kapstok.lastBackup");
  $("#last-backup").textContent = last? t("last_backup",{d:new Date(last).toLocaleString(LOCALE[L])}) : t("no_backup_yet");
  const old = !last || (Date.now()-new Date(last))>7*864e5;
  if(S.children.size && old) notice(`<span>${esc(t(last?"backup_old":"backup_none"))}</span><button class="btn small" data-act="go-admin">${esc(t("make_backup"))}</button>`);
  else if(location.protocol!=="file:") notice("");
}
async function buildBackup(photoDays){
  const [children, days, reports, photos]=await Promise.all([DB.all("children"),DB.all("days"),DB.all("reports"),DB.all("photos")]);
  const out=[];
  if(photoDays>0){
    const since=Date.now()-photoDays*864e5;
    const keep=new Set(children.map(c=>c.photo).filter(Boolean));
    for(const p of photos){ if(keep.has(p.id) || new Date(p.createdAt).getTime()>=since) out.push({id:p.id, createdAt:p.createdAt, data:await blobToDataURL(p.blob)}); }
  }
  return new Blob([JSON.stringify({app:"kapstok", version:1, exportedAt:new Date().toISOString(), children, days, reports, photos:out})], {type:"application/json"});
}
async function makeBackup(photoDays){
  const box=$("#backup-ready"); box.innerHTML=`<span class="sub">${esc(t("backup_prep"))}</span>`;
  try{
    const blob=await buildBackup(photoDays);
    const name=`pimpapunt-backup-${dayKey()}${photoDays?"-foto":""}.json`;
    box.innerHTML=`<button class="btn go" id="bk-save" type="button">${esc(t("backup_save",{s:(blob.size/1048576).toFixed(1)}))}</button>`;
    $("#bk-save").addEventListener("click", async ()=>{ await saveFile(name, blob); localStorage.setItem("kapstok.lastBackup", new Date().toISOString()); checkBackupAge(); box.innerHTML=""; });
  }catch(err){ box.innerHTML=""; toast(t("backup_fail")); }
}
$("#restore-in").addEventListener("change", async ev=>{
  const f=ev.target.files[0]; ev.target.value=""; if(!f) return;
  let data; try{ data=JSON.parse(await f.text()); }catch(_){ toast(t("restore_invalid")); return; }
  if(!data || data.app!=="kapstok"){ toast(t("restore_notours")); return; }
  if(!confirm(t("restore_confirm",{d:new Date(data.exportedAt).toLocaleString(LOCALE[L])}))) return;
  toast(t("restoring"));
  try{
    for(const c of data.children||[]) await DB.put("children",c);
    for(const d of data.days||[]) await DB.put("days",d);
    for(const r of data.reports||[]) await DB.put("reports",r);
    for(const p of data.photos||[]){ const blob=await (await fetch(p.data)).blob(); await DB.put("photos",{id:p.id, blob, createdAt:p.createdAt}); }
    urlCache.clear(); await loadAll(); toast(t("restored"));
  }catch(err){ failWrite(err); }
});
async function storageInfo(){
  const el=$("#storage-info"); el.textContent=t("computing"); let txt="";
  try{
    if(navigator.storage && navigator.storage.estimate){ const e=await navigator.storage.estimate(); txt+=t("storage_used",{s:((e.usage||0)/1048576).toFixed(1)}); }
    if(navigator.storage && navigator.storage.persisted){ const p=await navigator.storage.persisted(); txt+= t(p?"storage_ok":"storage_warn"); }
  }catch(_){}
  el.textContent=txt||t("storage_na");
}

/* ================= click routing ================= */
function showTab(name){
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected", String(b.dataset.tab===name)));
  ["today","kids","admin"].forEach(n=>$("#view-"+n).classList.toggle("hidden", n!==name));
  if(name==="admin"){ storageInfo(); checkBackupAge(); }
}
document.addEventListener("click", ev=>{
  const lb=ev.target.closest("[data-lang]"); if(lb){ setLang(lb.dataset.lang); return; }
  const b=ev.target.closest("[data-open],[data-edit],[data-act],[data-link],[data-tab],[data-report]"); if(!b) return;
  if(b.dataset.tab){ showTab(b.dataset.tab); return; }
  if(b.dataset.open){ openChild(b.dataset.open); return; }
  if(b.dataset.edit){ openForm(b.dataset.edit); return; }
  if(b.dataset.report){ openReport(S.openChild, b.dataset.report); return; }
  if(b.dataset.link){ const c=S.children.get(b.dataset.link); if(!c) return;
    const data=Object.assign({}, c, {badge:normBadge(b.dataset.code), updatedAt:new Date().toISOString()});
    DB.put("children",data).then(()=>{ S.children.set(c.id,data); toast(t("badge_linked",{n:c.voornaam})); closeSheet(); renderAll(); }, failWrite); return; }
  const id=S.openChild, a=b.dataset.act;
  switch(a){
    case "close": closeSheet(); break;
    case "go-kids": showTab("kids"); openForm(null); break;
    case "go-admin": showTab("admin"); break;
    case "new-kid": openForm(null); break;
    case "in": checkIn(id, at()); toast(t("is_in",{n:S.children.get(id).voornaam})); resetTime(); break;
    case "out": { const tt=at(); checkOut(id,tt); resetTime(); openMail(id); break; }
    case "sleep": { const tt=at(); saveEntry(id,e=>{ const s=e.sleeps[e.sleeps.length-1]; if(s&&!s.end) s.end=tt; else e.sleeps.push({start:tt,end:null}); }); resetTime(); break; }
    case "dia": saveEntry(id,e=>e.diapers.push({t:at(), kind:b.dataset.kind})); toast(t("dia_toast",{k:diaLabel(b.dataset.kind)})); resetTime(); break;
    case "note": addNote(id); break;
    case "food-type": { const d=draft(id); d.type = d.type===b.dataset.food ? "" : b.dataset.food; renderSheet(); break; }
    case "food-step": { const d=draft(id); setFoodVal(id, (d.type==="bottle"?d.ml:d.g) + (+b.dataset.d)); break; }
    case "food-add": { const d=draft(id); if(!d.type) break;
      const fnote=$("#food-note"); if(fnote) d.note=fnote.value.trim();
      const m={t:at(), type:d.type}; if(d.type==="bottle") m.ml=d.ml; else if(d.type==="potato") m.g=d.g; else if(d.note) m.note=d.note;
      d.type=""; d.note="";
      saveEntry(id, e=>{ (e.meals=e.meals||[]).push(m); }); toast(mealText(m)); resetTime(); break; }
    case "del": { const k=b.dataset.k, i=+b.dataset.i, f=b.dataset.f;
      if(!confirm(t("confirm_del"))) break;
      saveEntry(id,e=>{ if(k==="sessions"&&f==="out") e.sessions[i].out=null; else e[k].splice(i,1); }); break; }
    case "delphoto": { const i=+b.dataset.i; const p=entry(id).photos[i]; if(!p) break;
      if(!confirm(t("confirm_delphoto"))) break;
      saveEntry(id,e=>e.photos.splice(i,1)); DB.del("photos",p.id).catch(()=>{}); break; }
    case "mail": openMail(id); break;
    case "back": openChild(id); break;
    case "edit": openForm(id); break;
    case "copy": { const ta=$("#m-body"); const txt=$("#m-subj").value+"\n\n"+ta.value;
      (navigator.clipboard? navigator.clipboard.writeText(txt) : Promise.reject()).then(()=>toast(t("copied")), ()=>{ ta.select(); toast(t("select_copy")); }); break; }
    case "delete-kid": { const c=S.children.get(id); if(!c) break;
      if(!confirm(t("confirm_delkid",{n:fullName(c)}))) break;
      DB.del("children",id).then(()=>{ S.children.delete(id); toast(t("kid_deleted",{n:c.voornaam})); closeSheet(); renderAll(); }, failWrite); break; }
    case "backup": makeBackup(+b.dataset.photos); break;
    case "csv-export": saveFile("kinderen-"+dayKey()+".csv", new Blob([toCSV(kidsSorted())],{type:"text/csv"})); break;
    case "csv-template": saveFile("kinderen-sjabloon.csv", new Blob([toCSV([])],{type:"text/csv"})); break;
  }
});
